name: CI

on:
  # 只在打 tag 时跑：push 分支和 PR 都不触发。发版流水线就是 CI 的全部内容。
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mdview-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mdview-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mdview-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=.exe; [ "${{ runner.os }}" = "Windows" ] || ext=
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mdview${ext}" dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "mdview${ext}"
      # v7 upload + v8 download 是一对（v8 的 direct-download 就是为 v7 的 direct-upload 加的），
      # 一起升；v8 还把摘要不一致从警告改成了报错。都跑在 Node 24 上，官方 runner 会自动满
      # 要求（>=2.327.1），不再报 Node 20 deprecated。
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  # tag 推上来就顺手发到 crates.io。token 存仓库 secret CARGO_REGISTRY_TOKEN
  # （crates.io -> Account Security -> API Access，建一个只对 mdview-rs 生效的 crate-scoped token）。
  # 现在触发条件只有 tag，这两个 if 看着多余；留着是最后一道闸：以后谁再
  # 加个手动或分支触发，也不至于直接把东西发到 crates.io。
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: tag version must match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$got" != "$want" ]; then echo "tag is v$want but Cargo.toml says $got"; exit 1; fi
      # 不加 --no-verify：这一步会把 tarball 解开重建，相当于本地 dry-run。
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
