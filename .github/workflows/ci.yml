name: CI

on:
  push:
    tags: ["v*"]
  # PR 和手动 run 跑 check + build，不发版：release / publish 都锁在 tag 上（见各自 if），
  # 所以这类 run 再也不会碰 crates.io。注意 push 分支本身不触发 —— 想验 main 就 dispatch。
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mdview-x86_64-unknown-linux-gnu
          # 官方 ubuntu-latest 是 x86_64：要出 ARM 包只能靠 QEMU 模拟，慢且在链接器上容易翻车；
          # ARM runner 是原生 codegen。（ARM runner 按分钟加权计费，一年一次发版忽略不计。）
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: mdview-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mdview-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mdview-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=.exe; [ "${{ runner.os }}" = "Windows" ] || ext=
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mdview${ext}" dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "mdview${ext}"
      # 冒烟：产物要真能跑起来。v0.3.0 那次 tag 打在 Cargo.toml=0.2.0 上，发出去的包
      # 全打印 0.2.0，而 publish 只校验不修复 —— tag 构建就顺手跟 tag 比一下版本。
      - name: Smoke the binary
        shell: bash
        run: |
          set -euo pipefail
          bin=./dist/mdview
          [ -f "$bin" ] || bin=./dist/mdview.exe
          out="$("$bin" --version)"
          echo "$out"
          case "${GITHUB_REF:-}" in
            refs/tags/v*)
              v="${GITHUB_REF_NAME#v}"
              case "$out" in
                *"$v"*) ;;
                *) echo "::error::version mismatch: binary says $out, tag is $GITHUB_REF_NAME"; exit 1 ;;
              esac
              ;;
          esac
      # v7 upload + v8 download 是一对（v8 的 direct-download 就是为 v7 的 direct-upload 加的），
      # 一起升；v8 还把摘要不一致从警告改成了报错。都跑在 Node 24 上，官方 runner 会自动满
      # 要求（>=2.327.1），不再报 Node 20 deprecated。
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  # tarball 一落地就把它自己的 sha256 写回 Formula/mdview.rb。这一步以前得人在 tag 之后手动补，
  # 忘一次 brew tap 就一直装旧版。提交基于 main （不是 tag 的 detached HEAD，那会把 main 往
  # 后退）；推不上去就是有人在这几分钟里合了东西，红着报出来就好。
  tap:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: MDVIEW_ARCHIVE_DIR=artifacts scripts/formula.sh "${GITHUB_REF_NAME#v}"
      - name: Commit the formula
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mdview.rb
          if git diff --cached --quiet; then echo "Formula 没变化，跳过提交"; exit 0; fi
          git commit -m "chore: Formula 同步 v${GITHUB_REF_NAME#v} 的 sha256 [skip ci]"
          git push origin HEAD:main

  # tag 推上来就顺手发到 crates.io。token 存仓库 secret CARGO_REGISTRY_TOKEN
  # （crates.io -> Account Security -> API Access，建一个只对 mdview-rs 生效的 crate-scoped token）。
  # 现在触发条件只有 tag，这两个 if 看着多余；留着是最后一道闸：以后谁再
  # 加个手动或分支触发，也不至于直接把东西发到 crates.io。
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: tag version must match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$got" != "$want" ]; then echo "tag is v$want but Cargo.toml says $got"; exit 1; fi
      # 不加 --no-verify：这一步会把 tarball 解开重建，相当于本地 dry-run。
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
