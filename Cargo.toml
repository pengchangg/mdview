[package]
name = "mdview-rs"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Terminal Markdown viewer: scroll, search, outline, mermaid diagrams, live reload"
license = "MIT"
repository = "https://github.com/pengchangg/mdview"
homepage = "https://github.com/pengchangg/mdview"
keywords = ["markdown", "tui", "viewer", "mermaid", "terminal"]
categories = ["command-line-utilities", "text-processing"]
# 仓库跟包一起放着但不该进 crates.io tarball 的东西（补全脚本、tap、CI）。
exclude = ["install.sh", "Formula", "scripts", ".github", "examples"]

# 包名带 -rs 只是为了在 crates.io 上避名，库和命令还是 mdview。
[lib]
name = "mdview"
path = "src/lib.rs"

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
color-eyre = "0.6.5"
crossterm = "0.29.0"
mermaid-text = "0.57.0"
notify = "8.2.1"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
regex = "1.13.1"
toml_edit = { version = "0.23", default-features = false, features = ["parse"] }
tui-markdown = "0.3.13"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
