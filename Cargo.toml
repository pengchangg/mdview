[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "终端里的 Markdown 预览器：滚动、搜索、大纲、mermaid、保存即刷新"
license = "MIT"
repository = "https://github.com/your-name/mdView"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
mermaid-text = "0.57.0"
notify = "8.2.1"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
tui-markdown = "0.3.13"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# cargo-dist 用；跑 `cargo dist init` 之前先留着，构建配置就这一处。
[profile.dist]
inherits = "release"

[package.metadata.dist]
dist = true
installers = ["shell", "powershell"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
